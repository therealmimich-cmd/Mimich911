# Этот файл удобен, если захочется запустить мессенджер локально
# или в Dokploy через режим «Docker Compose».
# Самое важное здесь — volume (хранилище), чтобы база данных не пропадала.

services:
  messenger:
    build: .
    restart: unless-stopped
    environment:
      - PORT=3000
      - DATA_DIR=/app/data
    volumes:
      - messenger-data:/app/data
    ports:
      - "3000:3000"

volumes:
  messenger-data:
