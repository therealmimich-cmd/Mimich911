# ============================================================================
#  Настройки сборки для Nixpacks (именно так собирает Dokploy).
# ----------------------------------------------------------------------------
#  Здесь мы по-простому описываем шаги сборки и запуска.
#  Программы (Node.js нужной версии) Nixpacks подберёт сам — он уже это умел.
# ============================================================================

# Шаг 1. Установка «деталей» проекта.
# --omit=dev означает «не ставить ничего лишнего, только нужное для работы».
[phases.install]
cmds = ["npm install --omit=dev"]

# Шаг 2. Команда запуска мессенджера.
# --no-warnings просто убирает техническое предупреждение из логов.
[start]
cmd = "node --no-warnings server.js"
